# Ledger — static single-page app.
#
# Rendered by the nginx base image's entrypoint, which runs envsubst over
# /etc/nginx/templates/*.template, so ${PORT} below comes from the environment.

server {
    listen       ${PORT};
    listen       [::]:${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Never advertise the version behind a reverse proxy.
    server_tokens off;

    # Respect the scheme a terminating proxy reports, so redirects stay HTTPS.
    absolute_redirect off;

    # Compression. Brotli is not in the alpine image, so gzip is what we have.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Sensible defaults for an app that talks to nothing but itself. The CSP is
    # deliberately strict: no external origins are needed at runtime.
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "SAMEORIGIN"         always;
    add_header Referrer-Policy          "no-referrer"        always;
    add_header Cross-Origin-Opener-Policy "same-origin"      always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; object-src 'none'" always;

    # Cheap liveness endpoint for the container healthcheck and any load balancer.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Content-hashed assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The service worker and manifest must never be served stale, or a deploy
    # cannot roll out.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # The app uses hash-based routing, so every real path is a file. Falling back
    # to index.html keeps it working anyway if that ever changes.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Do not serve dotfiles if any ever end up in the image.
    location ~ /\. {
        deny all;
    }
}
