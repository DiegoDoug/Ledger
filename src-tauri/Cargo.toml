[package]
name = "ledger"
version = "1.1.0"
description = "Ledger — a local-first personal finance app"
authors = ["Ledger"]
edition = "2021"
rust-version = "1.77"

# See https://tauri.app/v1/api/config/#buildconfig.beforedevcommand
[lib]
name = "ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, slower-to-build binaries — worth it for a shipped installer.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
